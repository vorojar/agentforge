services:
  agentforge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_TYPE=postgres
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-agentforge}
      - POSTGRES_PASSWORD
      - POSTGRES_DB=${POSTGRES_DB:-agentforge}
      - POSTGRES_URL
      - POSTGRES_POOL_MAX=${POSTGRES_POOL_MAX:-10}
      - POSTGRES_IDLE_TIMEOUT_MS=${POSTGRES_IDLE_TIMEOUT_MS:-30000}
      - POSTGRES_CONNECTION_TIMEOUT_MS=${POSTGRES_CONNECTION_TIMEOUT_MS:-5000}
      - LLM_PROVIDER=${LLM_PROVIDER:-claude}
      - LLM_API_KEY
      - LLM_BASE_URL
      - DEFAULT_MODEL
      - ADMIN_SECRET
      - ADMIN_EMAIL
      - ADMIN_PASSWORD
      - AUTH_SESSION_DAYS=${AUTH_SESSION_DAYS:-7}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - CORS_ORIGIN
      - PUBLIC_URL
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-agentforge}
      - POSTGRES_USER=${POSTGRES_USER:-agentforge}
      - POSTGRES_PASSWORD
    volumes:
      - agentforge-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  agentforge-postgres:
