services:
  agentforge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - agentforge-data:/app/data
    environment:
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_PATH=${DB_PATH:-/app/data/agentforge.db}
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-agentforge}
      - MYSQL_PASSWORD
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agentforge}
      - MYSQL_URL=${MYSQL_URL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-claude}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-}
      - ADMIN_SECRET
      - ADMIN_EMAIL
      - ADMIN_PASSWORD
      - AUTH_SESSION_DAYS=${AUTH_SESSION_DAYS:-7}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - PUBLIC_URL=${PUBLIC_URL}
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agentforge}
      - MYSQL_USER=${MYSQL_USER:-agentforge}
      - MYSQL_PASSWORD
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - agentforge-mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  agentforge-data:
  agentforge-mysql:
